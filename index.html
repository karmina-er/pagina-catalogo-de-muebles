<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/pagina-catalogo-de-muebles/manifest.json" />
    <link rel="icon" type="image/png" href="/pagina-catalogo-de-muebles/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/pagina-catalogo-de-muebles/icons/icon-192.png" />
    <meta name="theme-color" content="#0d6efd" />
    <title>Multiforme — Mueblería de Autor</title>
    <meta name="description" content="Catálogo exclusivo de mobiliario de diseño residencial. Piezas de autor en terciopelo rojo vino, nogal europeo, travertino y latón cepillado." />
    <meta property="og:title" content="Multiforme — Mueblería de Autor" />
    <meta property="og:description" content="Catálogo exclusivo de mobiliario de diseño residencial. Piezas de autor en terciopelo rojo vino, nogal europeo, travertino y latón cepillado." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('multiforme_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F9F8F6] text-[#1A1A1A] dark:bg-[#141413] dark:text-[#F4F1EC] antialiased selection:bg-[#8C6D53] selection:text-[#F9F8F6]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const registration = navigator.serviceWorker.register(`${import.meta.env.BASE_URL}sw.js`, { scope: import.meta.env.BASE_URL });
          registration
            .then(reg => console.log('SW registrado:', reg.scope))
            .catch(err => console.error('Error al registrar SW:', err));
        });
      }
    </script>
  </body>
</html>
